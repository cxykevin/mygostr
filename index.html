<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyGO Street - AI Quant Research</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter font for that clean, Apple-like aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              mac: {
                gray: '#f5f5f7',
                border: '#d2d2d7',
                text: '#1d1d1f',
                accent: '#0066cc', // Classic Apple Blue
                dark: '#1c1c1e',
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom scrollbar for a cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9ca3af;
      }
      body {
        background-color: #f5f5f7;
        color: #1d1d1f;
      }
      /* Markdown Styles */
      .prose p { margin-bottom: 0.75em; }
      .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 0.75em; }
      .prose ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 0.75em; }
      .prose strong { font-weight: 600; }
      .prose code { background-color: rgba(0,0,0,0.05); padding: 0.2em 0.4em; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.9em; }
      .dark .prose code { background-color: rgba(255,255,255,0.1); }
      .prose pre { margin-top: 0.5em; margin-bottom: 0.5em; }
    </style>

  }
}
